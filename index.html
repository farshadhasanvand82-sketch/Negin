<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TEKKEN REALISTIC 3D - 120FPS</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            font-family: 'Vazirmatn', sans-serif;
        }

        /* اجازه اسکرول در صورت نیاز در صفحات کوچک و نمایش تمام صفحه 16:9 */
        html, body {
            background-color: #050508;
            color: #fff;
            width: 100%;
            min-height: 100vh;
            overflow-x: hidden;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        #game-wrapper {
            position: relative;
            width: 100vw;
            height: 56.25vw; /* نسبت دقیق 16:9 */
            max-height: 100vh;
            max-width: 177.78vh;
            background: #000;
            box-shadow: 0 0 60px rgba(0, 0, 0, 0.95);
            overflow: hidden;
        }

        canvas {
            width: 100% !important;
            height: 100% !important;
            display: block;
        }

        /* منوی انتخاب شخصیت با پیش‌نمایش واقعی عکس‌های شما */
        .overlay-screen {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at center, rgba(20, 18, 28, 0.88) 0%, rgba(5, 5, 10, 0.96) 100%);
            backdrop-filter: blur(15px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 20;
            padding: 15px;
            overflow-y: auto;
        }

        .hidden { display: none !important; }

        h1.game-title {
            font-size: clamp(22px, 3.5vw, 46px);
            font-weight: 900;
            background: linear-gradient(90deg, #ff3c5f, #ff8e53, #ffd200);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 6px;
        }

        .char-grid {
            display: flex;
            gap: 18px;
            justify-content: center;
            width: 92%;
            max-width: 950px;
            margin: 15px 0;
        }

        .char-card {
            flex: 1;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.15);
            border-radius: 16px;
            padding: 12px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .char-card:hover { transform: translateY(-4px); border-color: rgba(255,255,255,0.4); }
        .char-card.selected {
            border-color: #ff2a85;
            background: linear-gradient(180deg, rgba(255, 42, 133, 0.25) 0%, rgba(15, 12, 25, 0.9) 100%);
            box-shadow: 0 0 30px rgba(255, 42, 133, 0.5);
        }

        .char-preview-box {
            width: clamp(80px, 11vw, 130px);
            height: clamp(100px, 14vw, 165px);
            border-radius: 12px;
            overflow: hidden;
            background: rgba(0,0,0,0.4);
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .char-preview-box canvas {
            width: 100% !important;
            height: 100% !important;
            object-fit: contain;
        }

        .upload-mini-btn {
            font-size: 11px;
            background: rgba(255,255,255,0.12);
            color: #ddd;
            border: 1px solid rgba(255,255,255,0.2);
            padding: 3px 8px;
            border-radius: 6px;
            margin-top: 5px;
            cursor: pointer;
        }

        .btn-main {
            background: linear-gradient(45deg, #ff0055, #ff5e00);
            border: none;
            padding: 12px 42px;
            border-radius: 50px;
            color: white;
            font-size: clamp(14px, 1.6vw, 20px);
            font-weight: 900;
            cursor: pointer;
            box-shadow: 0 8px 25px rgba(255, 0, 85, 0.5);
        }

        /* HUD و شمارنده 120 FPS */
        #hud {
            position: absolute;
            top: 0; left: 0; right: 0;
            padding: 14px 28px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            z-index: 10;
            pointer-events: none;
        }

        .player-bar-box { width: 40%; }
        .player-info {
            display: flex;
            justify-content: space-between;
            font-size: clamp(12px, 1.4vw, 17px);
            font-weight: 900;
            margin-bottom: 5px;
            text-shadow: 0 2px 6px #000;
        }

        .hp-bg {
            width: 100%;
            height: clamp(14px, 1.8vw, 22px);
            background: rgba(0, 0, 0, 0.75);
            border: 2px solid rgba(255,255,255,0.85);
            border-radius: 6px;
            overflow: hidden;
        }

        .hp-fill {
            height: 100%;
            width: 100%;
            transition: width 0.15s ease-out;
        }
        #p1-hp { background: linear-gradient(90deg, #00f2fe, #0072ff); }
        #p2-hp { background: linear-gradient(90deg, #ff0844, #ff6a00); float: left; }

        .center-hud {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .timer-box {
            background: rgba(0,0,0,0.85);
            border: 2px solid #ffd200;
            color: #ffd200;
            font-size: clamp(18px, 2.3vw, 30px);
            font-weight: 900;
            padding: 3px 16px;
            border-radius: 10px;
        }

        .arena-badge {
            font-size: 11px;
            background: rgba(0,0,0,0.7);
            padding: 2px 10px;
            border-radius: 20px;
            color: #00f2fe;
            border: 1px solid rgba(0,242,254,0.4);
        }

        /* شمارش معکوس */
        #countdown-overlay {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 15;
            pointer-events: none;
        }
        #countdown-text {
            font-size: clamp(55px, 11vw, 140px);
            font-weight: 900;
            color: #fff;
            text-shadow: 0 0 35px #ff0055, 0 5px 15px #000;
        }

        /* دسته بازی (Gamepad) */
        #gamepad {
            position: absolute;
            bottom: 18px;
            left: 22px;
            right: 22px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            z-index: 12;
            pointer-events: none;
        }
        .pad-group { pointer-events: auto; }
        .dpad {
            display: grid;
            grid-template-columns: repeat(3, clamp(42px, 5.2vw, 62px));
            grid-template-rows: repeat(2, clamp(42px, 5.2vw, 62px));
            gap: 6px;
        }
        .action-pad {
            display: grid;
            grid-template-columns: repeat(2, clamp(48px, 6vw, 72px));
            grid-template-rows: repeat(2, clamp(48px, 6vw, 72px));
            gap: 8px;
        }
        .pad-btn {
            background: rgba(15, 15, 22, 0.55);
            backdrop-filter: blur(8px);
            border: 2px solid rgba(255, 255, 255, 0.35);
            border-radius: 14px;
            color: white;
            font-size: clamp(13px, 1.6vw, 20px);
            font-weight: 900;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        .pad-btn:active { background: rgba(255, 0, 85, 0.75); transform: scale(0.92); }
        .btn-punch { border-color: #00f2fe; color: #00f2fe; }
        .btn-kick { border-color: #ffd200; color: #ffd200; }
        .btn-block { border-color: #00e676; color: #00e676; }
        .btn-special { border-color: #ff1744; color: #ff1744; }

        .loader {
            width: 45px; height: 45px;
            border: 4px solid rgba(255,255,255,0.2);
            border-top-color: #ff0055;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 15px auto;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div id="game-wrapper">
    <!-- صفحه انتخاب شخصیت -->
    <div id="select-screen" class="overlay-screen">
        <h1 class="game-title">TEKKEN 3D REALISTIC</h1>
        <p style="color:#ccc; font-size:14px;">مبارز خود را انتخاب کنید (تصاویر اصلی شما با حذف خودکار پس‌زمینه)</p>

        <div class="char-grid">
            <!-- شخصیت ۱ -->
            <div class="char-card selected" data-char="char1" onclick="selectCharacter('char1', this)">
                <div class="char-preview-box"><canvas id="preview-char1"></canvas></div>
                <div style="font-weight:800; font-size:16px;">لونا (Gamer)</div>
                <label class="upload-mini-btn" onclick="event.stopPropagation()">
                    بارگذاری عکس ۱
                    <input type="file" accept="image/*" hidden onchange="handleCustomImage(event, 'char1')">
                </label>
            </div>

            <!-- شخصیت ۲ -->
            <div class="char-card" data-char="char2" onclick="selectCharacter('char2', this)">
                <div class="char-preview-box"><canvas id="preview-char2"></canvas></div>
                <div style="font-weight:800; font-size:16px;">استاد هیهاچی</div>
                <label class="upload-mini-btn" onclick="event.stopPropagation()">
                    بارگذاری عکس ۲
                    <input type="file" accept="image/*" hidden onchange="handleCustomImage(event, 'char2')">
                </label>
            </div>

            <!-- شخصیت ۳ -->
            <div class="char-card" data-char="char3" onclick="selectCharacter('char3', this)">
                <div class="char-preview-box"><canvas id="preview-char3"></canvas></div>
                <div style="font-weight:800; font-size:16px;">آرش (Fighter)</div>
                <label class="upload-mini-btn" onclick="event.stopPropagation()">
                    بارگذاری عکس ۳
                    <input type="file" accept="image/*" hidden onchange="handleCustomImage(event, 'char3')">
                </label>
            </div>
        </div>

        <button class="btn-main" onclick="startMatchmaking()">جستجوی حریف آنلاین</button>
    </div>

    <!-- صفحه جستجو -->
    <div id="search-screen" class="overlay-screen hidden">
        <h2 style="color:#ff2a85;">در حال اتصال به حریف آنلاین...</h2>
        <div class="loader"></div>
        <p id="search-status" style="color:#bbb; margin-bottom:15px;">در انتظار بازیکن دوم در فایربیس...</p>
        <button class="btn-main" style="background:#333; padding:8px 25px; font-size:14px;" onclick="cancelMatchmaking()">لغو</button>
    </div>

    <!-- صفحه پایان -->
    <div id="gameover-screen" class="overlay-screen hidden">
        <h1 id="winner-title" class="game-title">K.O.</h1>
        <p id="winner-sub" style="color:#ddd; margin-bottom:20px;"></p>
        <button class="btn-main" onclick="resetToMenu()">مبارزه مجدد</button>
    </div>

    <!-- HUD -->
    <div id="hud" class="hidden">
        <div class="player-bar-box">
            <div class="player-info">
                <span id="p1-name">بازیکن ۱</span>
                <span id="p1-hp-text">100%</span>
            </div>
            <div class="hp-bg"><div id="p1-hp" class="hp-fill"></div></div>
        </div>

        <div class="center-hud">
            <div class="timer-box" id="match-timer">99</div>
            <div class="arena-badge" id="arena-label">میدان مبارزه • 120 FPS</div>
        </div>

        <div class="player-bar-box" style="text-align: left;">
            <div class="player-info">
                <span id="p2-hp-text">100%</span>
                <span id="p2-name">بازیکن ۲</span>
            </div>
            <div class="hp-bg"><div id="p2-hp" class="hp-fill"></div></div>
        </div>
    </div>

    <!-- شمارش معکوس -->
    <div id="countdown-overlay" class="hidden">
        <div id="countdown-text">3</div>
    </div>

    <!-- دسته بازی -->
    <div id="gamepad" class="hidden">
        <div class="pad-group">
            <div class="dpad">
                <div></div>
                <div class="pad-btn" onpointerdown="setInput('up', true)" onpointerup="setInput('up', false)" onpointerleave="setInput('up', false)">▲</div>
                <div></div>
                <div class="pad-btn" onpointerdown="setInput('left', true)" onpointerup="setInput('left', false)" onpointerleave="setInput('left', false)">◀</div>
                <div class="pad-btn" onpointerdown="setInput('down', true)" onpointerup="setInput('down', false)" onpointerleave="setInput('down', false)">▼</div>
                <div class="pad-btn" onpointerdown="setInput('right', true)" onpointerup="setInput('right', false)" onpointerleave="setInput('right', false)">▶</div>
            </div>
        </div>
        <div class="pad-group">
            <div class="action-pad">
                <div class="pad-btn btn-punch" onpointerdown="triggerAction('punch')">مشت</div>
                <div class="pad-btn btn-kick" onpointerdown="triggerAction('kick')">لگد</div>
                <div class="pad-btn btn-block" onpointerdown="setInput('block', true)" onpointerup="setInput('block', false)" onpointerleave="setInput('block', false)">دفاع</div>
                <div class="pad-btn btn-special" onpointerdown="triggerAction('special')">ویژه</div>
            </div>
        </div>
    </div>

    <canvas id="game-canvas"></canvas>
</div>

<script>
// ============================================================================
// ۱. اتصال به فایربیس اختصاصی شما
// ============================================================================
const firebaseConfig = {
    databaseURL: "https://crazyapp-9663a-default-rtdb.firebaseio.com"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

const myPlayerId = 'p_' + Math.random().toString(36).substr(2, 9);
let selectedCharId = 'char1';
let currentRoomId = null;
let myRole = null;
let opponentRole = null;
let gameState = 'MENU';
let roomRef = null;
const queueRef = db.ref('tekken_realistic_queue');

const CHAR_NAMES = {
    char1: 'لونا (Gamer)',
    char2: 'استاد هیهاچی',
    char3: 'آرش (Fighter)'
};

const ARENA_NAMES = {
    forest: '🌲 جنگل تاریک',
    city: '🌃 شهر شبانه',
    cage: '⛓️ قفس مبارزه (MMA)',
    mat: '🤼 تشک کشتی المپیک'
};

// ============================================================================
// ۲. سیستم استخراج دقیق شخصیت‌ها از عکس‌های شما (بدون دستکاری و حذف پس‌زمینه)
// ============================================================================
const processedSprites = {
    char1: { front: null, side: null, back: null },
    char2: { front: null, side: null, back: null },
    char3: { front: null, side: null, back: null }
};

// برش هوشمند زوایای شخصیت از شیت‌های ۴تایی و ۳تایی شما و حذف پس‌زمینه یکنواخت
function processCharacterSheet(img, charKey) {
    const tempCanvas = document.createElement('canvas');
    const ctx = tempCanvas.getContext('2d');
    tempCanvas.width = img.width;
    tempCanvas.height = img.height;
    ctx.drawImage(img, 0, 0);

    // تشخیص رنگ پس‌زمینه از گوشه بالا-چپ تصویر
    const bgPixel = ctx.getImageData(2, 2, 1, 1).data;
    const imgData = ctx.getImageData(0, 0, img.width, img.height);
    const data = imgData.data;

    // حذف پس‌زمینه با حفظ کامل جزئیات خود شخصیت
    const tolerance = 38;
    for (let i = 0; i < data.length; i += 4) {
        const dr = Math.abs(data[i] - bgPixel[0]);
        const dg = Math.abs(data[i + 1] - bgPixel[1]);
        const dbVal = Math.abs(data[i + 2] - bgPixel[2]);
        if (dr < tolerance && dg < tolerance && dbVal < tolerance) {
            data[i + 3] = 0; // شفاف کردن پس‌زمینه
        }
    }
    ctx.putImageData(imgData, 0, 0);

    // برش دقیق هر زاویه بر اساس چیدمان تصاویر ارسالی شما
    let crops = {};
    if (charKey === 'char1') {
        // تصویر ۱: گرید ۲ در ۲ (بالا-چپ: روبه‌رو، پایین-چپ: نیم‌رخ، پایین-راست: پشت)
        const hw = img.width / 2;
        const hh = img.height / 2;
        crops = {
            front: { x: 0, y: 0, w: hw, h: hh },
            side:  { x: 0, y: hh, w: hw, h: hh },
            back:  { x: hw, y: hh, w: hw, h: hh }
        };
    } else if (charKey === 'char2') {
        // تصویر ۲: ۳ نمای افقی کنار هم (چپ: روبه‌رو، وسط: نیم‌رخ، راست: پشت)
        const tw = img.width / 3;
        crops = {
            front: { x: 0, y: 0, w: tw, h: img.height },
            side:  { x: tw, y: 0, w: tw, h: img.height },
            back:  { x: tw * 2, y: 0, w: tw, h: img.height }
        };
    } else {
        // تصویر ۳: ۴ نمای افقی کنار هم (اول: روبه‌رو، دوم: نیم‌رخ، سوم: پشت)
        const qw = img.width / 4;
        crops = {
            front: { x: 0, y: 0, w: qw, h: img.height },
            side:  { x: qw, y: 0, w: qw, h: img.height },
            back:  { x: qw * 2, y: 0, w: qw, h: img.height }
        };
    }

    ['front', 'side', 'back'].forEach(view => {
        const c = crops[view];
        const partCanvas = document.createElement('canvas');
        partCanvas.width = c.w;
        partCanvas.height = c.h;
        const pCtx = partCanvas.getContext('2d');
        pCtx.drawImage(tempCanvas, c.x, c.y, c.w, c.h, 0, 0, c.w, c.h);

        const tex = new THREE.CanvasTexture(partCanvas);
        tex.minFilter = THREE.LinearFilter;
        tex.magFilter = THREE.LinearFilter;
        processedSprites[charKey][view] = { canvas: partCanvas, texture: tex };
    });

    // نمایش در کارت انتخاب شخصیت
    const prevCanvas = document.getElementById('preview-' + charKey);
    if (prevCanvas && processedSprites[charKey].front) {
        const src = processedSprites[charKey].front.canvas;
        prevCanvas.width = src.width;
        prevCanvas.height = src.height;
        prevCanvas.getContext('2d').drawImage(src, 0, 0);
    }
}

// بارگذاری خودکار تصاویر اگر با نام‌های استاندارد کنار فایل باشند + امکان آپلود مستقیم
const DEFAULT_FILES = {
    char1: '1000025859.jpg',
    char2: '1000025858.jpg',
    char3: '1000025803.jpg'
};

Object.keys(DEFAULT_FILES).forEach(key => {
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = () => processCharacterSheet(img, key);
    img.onerror = () => {
        // اگر فایل محلی نبود، یک تصویر راهنما رسم می‌شود تا کاربر با دکمه بارگذاری عکس خود را انتخاب کند
        const prev = document.getElementById('preview-' + key);
        const ctx = prev.getContext('2d');
        prev.width = 120; prev.height = 150;
        ctx.fillStyle = '#222'; ctx.fillRect(0,0,120,150);
        ctx.fillStyle = '#fff'; ctx.font = '12px Vazirmatn'; ctx.textAlign = 'center';
        ctx.fillText('عکس ' + key.replace('char','') + ' را', 60, 70);
        ctx.fillText('بارگذاری کنید', 60, 90);
    };
    img.src = DEFAULT_FILES[key];
});

function handleCustomImage(event, charKey) {
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (e) => {
        const img = new Image();
        img.onload = () => processCharacterSheet(img, charKey);
        img.src = e.target.result;
    };
    reader.readAsDataURL(file);
}

function selectCharacter(charId, el) {
    selectedCharId = charId;
    document.querySelectorAll('.char-card').forEach(c => c.classList.remove('selected'));
    el.classList.add('selected');
}

// ============================================================================
// ۳. مچ‌میکینگ فایربیس + انتخاب رندوم زمین بازی
// ============================================================================
function startMatchmaking() {
    gameState = 'SEARCHING';
    document.getElementById('select-screen').classList.add('hidden');
    document.getElementById('search-screen').classList.remove('hidden');

    queueRef.once('value').then((snap) => {
        const waiting = snap.val();
        if (waiting && waiting.playerId !== myPlayerId && (Date.now() - waiting.timestamp < 30000)) {
            queueRef.remove().then(() => {
                myRole = 'p2';
                opponentRole = 'p1';
                const newRoomId = 'room_' + waiting.playerId + '_' + myPlayerId;
                const arenas = ['forest', 'city', 'cage', 'mat'];
                const randomArena = arenas[Math.floor(Math.random() * arenas.length)];

                const roomData = {
                    status: 'countdown',
                    arena: randomArena,
                    p1: { id: waiting.playerId, char: waiting.charId, x: -2.0, z: 0, y: 0, hp: 100, action: 'idle', hitTimer: 0, block: false, facing: 1 },
                    p2: { id: myPlayerId, char: selectedCharId, x: 2.0, z: 0, y: 0, hp: 100, action: 'idle', hitTimer: 0, block: false, facing: -1 }
                };

                db.ref('tekken_realistic_rooms/' + newRoomId).set(roomData).then(() => {
                    db.ref('tekken_realistic_invites/' + waiting.playerId).set({ roomId: newRoomId });
                    joinRoom(newRoomId);
                });
            });
        } else {
            myRole = 'p1';
            opponentRole = 'p2';
            queueRef.set({ playerId: myPlayerId, charId: selectedCharId, timestamp: Date.now() });
            queueRef.onDisconnect().remove();
            document.getElementById('search-status').innerText = 'در انتظار بازیکن دوم...';

            const invRef = db.ref('tekken_realistic_invites/' + myPlayerId);
            invRef.onDisconnect().remove();
            invRef.on('value', (s) => {
                if (s.val() && s.val().roomId) {
                    invRef.off();
                    invRef.remove();
                    joinRoom(s.val().roomId);
                }
            });
        }
    });
}

function cancelMatchmaking() {
    queueRef.remove();
    db.ref('tekken_realistic_invites/' + myPlayerId).off();
    db.ref('tekken_realistic_invites/' + myPlayerId).remove();
    gameState = 'MENU';
    document.getElementById('search-screen').classList.add('hidden');
    document.getElementById('select-screen').classList.remove('hidden');
}

// ============================================================================
// ۴. موتور گرافیکی واقع‌گرایانه Three.js (۴ زمین رندوم با نورپردازی PBR و سایه)
// ============================================================================
const canvas = document.getElementById('game-canvas');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(42, 16 / 9, 0.1, 150);
camera.position.set(0, 2.6, 8.2);

let arenaGroup = new THREE.Group();
scene.add(arenaGroup);

function buildRealisticArena(type) {
    // پاک کردن زمین قبلی
    while (arenaGroup.children.length > 0) {
        arenaGroup.remove(arenaGroup.children[0]);
    }
    scene.fog = null;

    // نورپردازی پایه واقع‌گرایانه
    const hemiLight = new THREE.HemisphereLight(0xffffff, 0x222233, 0.7);
    arenaGroup.add(hemiLight);

    const sunLight = new THREE.DirectionalLight(0xfff5e4, 1.4);
    sunLight.position.set(6, 12, 8);
    sunLight.castShadow = true;
    sunLight.shadow.mapSize.width = 2048;
    sunLight.shadow.mapSize.height = 2048;
    arenaGroup.add(sunLight);

    if (type === 'forest') {
        // ۱. زمین جنگل واقع‌گرایانه
        scene.background = new THREE.Color(0x1a2e1a);
        scene.fog = new THREE.FogExp2(0x1a2e1a, 0.045);

        const groundGeo = new THREE.CircleGeometry(14, 48);
        const groundMat = new THREE.MeshStandardMaterial({ color: 0x2d4222, roughness: 0.9 });
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        arenaGroup.add(ground);

        // تنه درختان و شاخ و برگ در اطراف رینگ
        const trunkMat = new THREE.MeshStandardMaterial({ color: 0x3b2716, roughness: 0.9 });
        const leafMat = new THREE.MeshStandardMaterial({ color: 0x1b4d1b, roughness: 0.8 });
        for (let i = 0; i < 18; i++) {
            const ang = (i / 18) * Math.PI * 2;
            const dist = 7.8 + (i % 3) * 1.5;
            const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.25, 0.4, 7, 10), trunkMat);
            trunk.position.set(Math.cos(ang) * dist, 3.5, Math.sin(ang) * dist);
            trunk.castShadow = true;
            arenaGroup.add(trunk);

            const crown = new THREE.Mesh(new THREE.DodecahedronGeometry(1.8), leafMat);
            crown.position.set(Math.cos(ang) * dist, 6.8, Math.sin(ang) * dist);
            arenaGroup.add(crown);
        }

    } else if (type === 'city') {
        // ۲. پشت‌بام / خیابان شهر شبانه با نورهای نئون و آسمان‌خراش
        scene.background = new THREE.Color(0x090d16);
        scene.fog = new THREE.FogExp2(0x090d16, 0.035);

        const asphalt = new THREE.Mesh(
            new THREE.BoxGeometry(16, 0.5, 12),
            new THREE.MeshStandardMaterial({ color: 0x1c1f26, roughness: 0.45, metalness: 0.3 })
        );
        asphalt.position.y = -0.25;
        asphalt.receiveShadow = true;
        arenaGroup.add(asphalt);

        // خط‌کشی خیابان و ساختمان‌های پس‌زمینه
        for (let i = -5; i <= 5; i++) {
            const bHeight = 8 + Math.abs(i * 2.3) % 10;
            const bMat = new THREE.MeshStandardMaterial({ color: 0x101522, roughness: 0.3, metalness: 0.7 });
            const building = new THREE.Mesh(new THREE.BoxGeometry(2.5, bHeight, 2.5), bMat);
            building.position.set(i * 3.2, bHeight / 2 - 2, -9 - (Math.abs(i) % 2) * 2);
            arenaGroup.add(building);
        }

        const neonPink = new THREE.PointLight(0xff0066, 2.5, 16);
        neonPink.position.set(-5, 3, -2);
        const neonCyan = new THREE.PointLight(0x00e5ff, 2.5, 16);
        neonCyan.position.set(5, 3, -2);
        arenaGroup.add(neonPink, neonCyan);

    } else if (type === 'cage') {
        // ۳. قفس مبارزه هشت‌ضلعی (Octagon MMA Cage)
        scene.background = new THREE.Color(0x111115);
        const matFloor = new THREE.Mesh(
            new THREE.CylinderGeometry(6.8, 6.8, 0.4, 8),
            new THREE.MeshStandardMaterial({ color: 0x2b2d33, roughness: 0.7 })
        );
        matFloor.position.y = -0.2;
        matFloor.receiveShadow = true;
        arenaGroup.add(matFloor);

        // فنس توری فلزی دور قفس
        const fenceGeo = new THREE.CylinderGeometry(6.75, 6.75, 2.6, 8, 1, true);
        const fenceMat = new THREE.MeshStandardMaterial({
            color: 0x888899,
            wireframe: true,
            transparent: true,
            opacity: 0.45
        });
        const fence = new THREE.Mesh(fenceGeo, fenceMat);
        fence.position.y = 1.3;
        arenaGroup.add(fence);

        // ستون‌های محافظ گوشه قفس
        for (let i = 0; i < 8; i++) {
            const ang = (i / 8) * Math.PI * 2 + Math.PI / 8;
            const post = new THREE.Mesh(
                new THREE.CylinderGeometry(0.16, 0.16, 2.8, 12),
                new THREE.MeshStandardMaterial({ color: 0xd90429, roughness: 0.4 })
            );
            post.position.set(Math.cos(ang) * 6.75, 1.4, Math.sin(ang) * 6.75);
            arenaGroup.add(post);
        }

    } else {
        // ۴. تشک کشتی استاندارد (آبی و دایره قرمز وسط)
        scene.background = new THREE.Color(0x141824);
        const baseMat = new THREE.Mesh(
            new THREE.BoxGeometry(13, 0.35, 13),
            new THREE.MeshStandardMaterial({ color: 0x1d4ed8, roughness: 0.65 })
        );
        baseMat.position.y = -0.175;
        baseMat.receiveShadow = true;
        arenaGroup.add(baseMat);

        const redRing = new THREE.Mesh(
            new THREE.RingGeometry(4.2, 4.9, 64),
            new THREE.MeshStandardMaterial({ color: 0xdc2626, side: THREE.DoubleSide, roughness: 0.6 })
        );
        redRing.rotation.x = -Math.PI / 2;
        redRing.position.y = 0.01;
        arenaGroup.add(redRing);

        const centerCircle = new THREE.Mesh(
            new THREE.CircleGeometry(1.1, 32),
            new THREE.MeshStandardMaterial({ color: 0xfacc15, roughness: 0.6 })
        );
        centerCircle.rotation.x = -Math.PI / 2;
        centerCircle.position.y = 0.01;
        arenaGroup.add(centerCircle);
    }
}

// ============================================================================
// ۵. ساخت کاراکتر سه‌بعدی با تصویر واقعی بدون دستکاری + سایه زیر پا
// ============================================================================
let fighters = { p1: null, p2: null };

function createRealPhotoFighter(charKey) {
    const group = new THREE.Group();

    const spriteData = processedSprites[charKey];
    const initialTex = spriteData.side ? spriteData.side.texture : (spriteData.front ? spriteData.front.texture : null);

    const mat = new THREE.MeshBasicMaterial({
        map: initialTex,
        transparent: true,
        alphaTest: 0.15,
        side: THREE.DoubleSide
    });

    const plane = new THREE.Mesh(new THREE.PlaneGeometry(1.75, 2.35), mat);
    plane.position.y = 1.18;
    group.add(plane);

    // سایه واقعی زیر پای شخصیت روی زمین
    const shadowGeo = new THREE.CircleGeometry(0.65, 24);
    const shadowMat = new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.45 });
    const shadow = new THREE.Mesh(shadowGeo, shadowMat);
    shadow.rotation.x = -Math.PI / 2;
    shadow.position.y = 0.02;
    group.add(shadow);

    // افکت ضربه (جرقه نورانی هنگام برخورد)
    const hitFlash = new THREE.Mesh(
        new THREE.SphereGeometry(0.45, 12, 12),
        new THREE.MeshBasicMaterial({ color: 0xffea00, transparent: true, opacity: 0 })
    );
    hitFlash.position.set(0, 1.3, 0.2);
    group.add(hitFlash);

    return { root: group, plane, mat, shadow, hitFlash, charKey };
}

function spawnFighters(p1Char, p2Char) {
    if (fighters.p1) scene.remove(fighters.p1.root);
    if (fighters.p2) scene.remove(fighters.p2.root);

    fighters.p1 = createRealPhotoFighter(p1Char);
    fighters.p1.root.position.set(-2.0, 0, 0);
    scene.add(fighters.p1.root);

    fighters.p2 = createRealPhotoFighter(p2Char);
    fighters.p2.root.position.set(2.0, 0, 0);
    scene.add(fighters.p2.root);
}

// ============================================================================
// ۶. ورود به اتاق، فیزیک برخورد واقعی (عدم عبور از هم) و واکنش به ضربه
// ============================================================================
let playersData = { p1: null, p2: null };

function joinRoom(roomId) {
    currentRoomId = roomId;
    roomRef = db.ref('tekken_realistic_rooms/' + roomId);
    roomRef.onDisconnect().remove();

    roomRef.once('value').then((snap) => {
        const roomData = snap.val();
        if (!roomData) return;

        playersData.p1 = roomData.p1;
        playersData.p2 = roomData.p2;

        buildRealisticArena(roomData.arena || 'cage');
        document.getElementById('arena-label').innerText = (ARENA_NAMES[roomData.arena] || 'میدان مبارزه') + ' • 120 FPS';

        document.getElementById('p1-name').innerText = CHAR_NAMES[playersData.p1.char] + (myRole === 'p1' ? ' (شما)' : '');
        document.getElementById('p2-name').innerText = CHAR_NAMES[playersData.p2.char] + (myRole === 'p2' ? ' (شما)' : '');

        spawnFighters(playersData.p1.char, playersData.p2.char);

        document.getElementById('search-screen').classList.add('hidden');
        document.getElementById('hud').classList.remove('hidden');
        document.getElementById('gamepad').classList.remove('hidden');

        startCountdown();
        listenToRoom();
    });
}

function startCountdown() {
    gameState = 'COUNTDOWN';
    const overlay = document.getElementById('countdown-overlay');
    const text = document.getElementById('countdown-text');
    overlay.classList.remove('hidden');

    const steps = ['3', '2', '1', 'FIGHT!'];
    let idx = 0;
    function next() {
        if (idx < steps.length) {
            text.innerText = steps[idx++];
            setTimeout(next, 800);
        } else {
            overlay.classList.add('hidden');
            gameState = 'PLAYING';
            startTimer();
        }
    }
    next();
}

let matchTime = 99;
let timerInt = null;
function startTimer() {
    matchTime = 99;
    clearInterval(timerInt);
    timerInt = setInterval(() => {
        if (gameState !== 'PLAYING') return;
        matchTime--;
        document.getElementById('match-timer').innerText = matchTime;
        if (matchTime <= 0) {
            clearInterval(timerInt);
            const p1Hp = playersData.p1.hp;
            const p2Hp = playersData.p2.hp;
            finishMatch(p1Hp >= p2Hp ? 'p1' : 'p2');
        }
    }, 1000);
}

// کنترل‌ها
const inputState = { left: false, right: false, up: false, down: false, block: false };
let localState = {
    x: 0, z: 0, y: 0, vy: 0,
    action: 'idle', actionTimer: 0,
    hitStunTimer: 0, // قفل شدن و پرتاب به عقب هنگام ضربه خوردن
    knockbackVx: 0,
    block: false, facing: 1
};

function setInput(key, val) {
    inputState[key] = val;
    if (key === 'block') {
        localState.block = val;
        syncState(true);
    }
}

window.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowLeft' || e.key === 'a') setInput('left', true);
    if (e.key === 'ArrowRight' || e.key === 'd') setInput('right', true);
    if (e.key === 'ArrowUp' || e.key === 'w') setInput('up', true);
    if (e.key === 'ArrowDown' || e.key === 's') setInput('down', true);
    if (e.key === ' ') setInput('block', true);
    if (e.key === 'j' || e.key === 'z') triggerAction('punch');
    if (e.key === 'k' || e.key === 'x') triggerAction('kick');
    if (e.key === 'l' || e.key === 'c') triggerAction('special');
});

window.addEventListener('keyup', (e) => {
    if (e.key === 'ArrowLeft' || e.key === 'a') setInput('left', false);
    if (e.key === 'ArrowRight' || e.key === 'd') setInput('right', false);
    if (e.key === 'ArrowUp' || e.key === 'w') setInput('up', false);
    if (e.key === 'ArrowDown' || e.key === 's') setInput('down', false);
    if (e.key === ' ') setInput('block', false);
});

function triggerAction(type) {
    if (gameState !== 'PLAYING') return;
    if (localState.actionTimer > 0 || localState.hitStunTimer > 0 || localState.block) return;

    localState.action = type;
    localState.actionTimer = type === 'special' ? 0.5 : 0.32;

    const oppData = playersData[opponentRole];
    if (oppData) {
        const dx = Math.abs(localState.x - oppData.x);
        const dz = Math.abs(localState.z - (oppData.z || 0));
        const reach = type === 'special' ? 2.1 : (type === 'kick' ? 1.65 : 1.35);

        // بررسی اصابت ضربه در فاصله نزدیک و هم‌راستا در عمق
        if (dx <= reach && dz <= 0.85) {
            let dmg = type === 'special' ? 20 : (type === 'kick' ? 12 : 8);
            if (oppData.block) dmg = Math.floor(dmg * 0.2);

            const newHp = Math.max(0, oppData.hp - dmg);
            // ثبت ضربه خوردن حریف در فایربیس تا واکنش نشان دهد
            roomRef.child(opponentRole).update({
                hp: newHp,
                hitTimestamp: Date.now(),
                hitPower: type === 'special' ? 2 : 1
            });
        }
    }
    syncState(true);
}

let lastHitHandled = 0;
function listenToRoom() {
    localState.x = myRole === 'p1' ? -2.0 : 2.0;
    localState.facing = myRole === 'p1' ? 1 : -1;

    roomRef.on('value', (snap) => {
        const data = snap.val();
        if (!data) return;
        playersData.p1 = data.p1;
        playersData.p2 = data.p2;

        // آپدیت نوار جان
        document.getElementById('p1-hp').style.width = data.p1.hp + '%';
        document.getElementById('p1-hp-text').innerText = data.p1.hp + '%';
        document.getElementById('p2-hp').style.width = data.p2.hp + '%';
        document.getElementById('p2-hp-text').innerText = data.p2.hp + '%';

        // واکنش فیزیکی واقعی وقتی خودمان ضربه می‌خوریم!
        const myServerData = data[myRole];
        if (myServerData && myServerData.hitTimestamp && myServerData.hitTimestamp > lastHitHandled) {
            lastHitHandled = myServerData.hitTimestamp;
            localState.hitStunTimer = 0.35; // لرزش و شوک ضربه
            localState.action = 'hurt';
            // پرتاب شدن به عقب در جهت مخالف حریف
            const pushDir = localState.facing === 1 ? -1 : 1;
            localState.knockbackVx = pushDir * (myServerData.hitPower === 2 ? 7.5 : 4.5);
            if (myServerData.hitPower === 2) localState.vy = 3.2; // پرتاب به هوا در ضربه ویژه
            triggerScreenShake();
        }

        if (gameState === 'PLAYING' && (data.p1.hp <= 0 || data.p2.hp <= 0)) {
            finishMatch(data.p2.hp <= 0 ? 'p1' : 'p2');
        }
    });
}

let shakeIntensity = 0;
function triggerScreenShake() {
    shakeIntensity = 0.25;
}

let lastSync = 0;
function syncState(force = false) {
    if (!roomRef || !myRole) return;
    const now = Date.now();
    if (!force && now - lastSync < 35) return; // نرخ بالای همگام‌سازی برای روانی 120FPS
    lastSync = now;

    roomRef.child(myRole).update({
        x: Number(localState.x.toFixed(3)),
        y: Number(localState.y.toFixed(3)),
        z: Number(localState.z.toFixed(3)),
        action: localState.action,
        block: localState.block,
        facing: localState.facing
    });
}

function finishMatch(winner) {
    gameState = 'GAMEOVER';
    clearInterval(timerInt);
    document.getElementById('gamepad').classList.add('hidden');
    document.getElementById('gameover-screen').classList.remove('hidden');
    const win = (winner === myRole);
    document.getElementById('winner-title').innerText = win ? 'K.O. - شما برنده شدید!' : 'K.O. - شکست خوردید!';
    document.getElementById('winner-sub').innerText = win ? 'ضربه نهایی حریف را از پای درآورد' : 'حریف برنده این مبارزه شد';
}

function resetToMenu() {
    if (roomRef) { roomRef.off(); roomRef.remove(); roomRef = null; }
    gameState = 'MENU';
    document.getElementById('gameover-screen').classList.add('hidden');
    document.getElementById('hud').classList.add('hidden');
    document.getElementById('select-screen').classList.remove('hidden');
}

// ============================================================================
// ۷. حلقه رندر 120FPS، برخورد فیزیکی بازیکنان (عدم عبور از هم) و انیمیشن عکس‌ها
// ============================================================================
let lastFrameTime = performance.now();

function gameLoop(now) {
    requestAnimationFrame(gameLoop);

    // محاسبه دقیق Delta Time برای اجرای نرم روی نمایشگرهای 120Hz و 60Hz
    const dt = Math.min((now - lastFrameTime) / 1000, 0.05);
    lastFrameTime = now;

    if (gameState === 'PLAYING' && fighters[myRole] && fighters[opponentRole]) {
        const oppData = playersData[opponentRole];
        const oppX = oppData ? oppData.x : 0;
        const oppZ = oppData ? (oppData.z || 0) : 0;

        // ۱. مدیریت شوک ضربه خوردن (Hit Reaction & Knockback)
        if (localState.hitStunTimer > 0) {
            localState.hitStunTimer -= dt;
            localState.x += localState.knockbackVx * dt;
            localState.knockbackVx *= 0.88; // اصطکاک زمین
            if (localState.hitStunTimer <= 0) {
                localState.action = 'idle';
                syncState(true);
            }
        } else {
            // ۲. حرکت عادی بازیکن در صورتی که ضربه نخورده باشد
            const moveSpeed = 4.6;
            if (inputState.left) localState.x -= moveSpeed * dt;
            if (inputState.right) localState.x += moveSpeed * dt;
            if (inputState.down) localState.z += moveSpeed * 0.75 * dt;
            if (inputState.up && localState.y === 0) localState.vy = 6.8;
        }

        // جاذبه پرش
        if (localState.y > 0 || localState.vy !== 0) {
            localState.y += localState.vy * dt;
            localState.vy -= 19 * dt;
            if (localState.y <= 0) { localState.y = 0; localState.vy = 0; }
        }

        // ۳. برخورد فیزیکی (Collision) تا بازیکنان مثل روح از هم رد نشوند!
        const minSeparation = 0.95; // حداقل فاصله بدنی دو مبارز
        const dx = localState.x - oppX;
        const dz = localState.z - oppZ;
        const dist2D = Math.hypot(dx, dz);

        if (dist2D < minSeparation && localState.y < 1.2) {
            // هل دادن نرم به بیرون از بدن حریف
            const pushAngle = dist2D > 0.001 ? Math.atan2(dz, dx) : (myRole === 'p1' ? Math.PI : 0);
            localState.x = oppX + Math.cos(pushAngle) * minSeparation;
            localState.z = oppZ + Math.sin(pushAngle) * minSeparation;
        }

        // محدودیت مرزهای رینگ
        localState.x = Math.max(-5.8, Math.min(5.8, localState.x));
        localState.z = Math.max(-4.5, Math.min(4.5, localState.z));

        // تایمر ضربه زدن
        if (localState.actionTimer > 0) {
            localState.actionTimer -= dt;
            if (localState.actionTimer <= 0 && localState.action !== 'hurt') {
                localState.action = 'idle';
                syncState(true);
            }
        }

        // نگاه کردن همیشگی به سمت حریف
        localState.facing = localState.x <= oppX ? 1 : -1;
        syncState();

        // ۴. به‌روزرسانی گرافیکی خودمان و حریف با عکس‌های واقعی
        updateFighterVisuals(fighters[myRole], localState, (inputState.left || inputState.right || inputState.down));

        if (oppData) {
            const oppMesh = fighters[opponentRole];
            oppMesh.root.position.lerp(new THREE.Vector3(oppData.x, oppData.y || 0, oppData.z || 0), 0.35);
            updateFighterVisuals(oppMesh, oppData, false, true);
        }

        // ۵. دوربین سینمایی پویا + لرزش هنگام اصابت ضربه
        const p1Pos = fighters.p1.root.position;
        const p2Pos = fighters.p2.root.position;
        const midX = (p1Pos.x + p2Pos.x) / 2;
        const sep = Math.abs(p1Pos.x - p2Pos.x);
        const targetZ = Math.max(5.8, Math.min(9.8, sep * 1.1 + 4.2));

        let shakeX = 0, shakeY = 0;
        if (shakeIntensity > 0) {
            shakeX = (Math.random() - 0.5) * shakeIntensity;
            shakeY = (Math.random() - 0.5) * shakeIntensity;
            shakeIntensity *= 0.85;
            if (shakeIntensity < 0.01) shakeIntensity = 0;
        }

        camera.position.x += (midX - camera.position.x) * 0.15 + shakeX;
        camera.position.y = 2.4 + shakeY;
        camera.position.z += (targetZ - camera.position.z) * 0.15;
        camera.lookAt(midX, 1.25, 0);
    }

    renderer.render(scene, camera);
}

// اعمال دقیق عکس‌ها و واکنش‌های حرکتی/ضربه روی هر کاراکتر
function updateFighterVisuals(fighterObj, state, isMoving, isRemote = false) {
    if (!isRemote) {
        fighterObj.root.position.set(state.x, state.y, state.z);
    }

    const sprites = processedSprites[fighterObj.charKey];
    // انتخاب نمای نیم‌رخ هنگام مبارزه و جهت‌دهی دقیق به سمت حریف
    if (sprites && sprites.side) {
        fighterObj.mat.map = sprites.side.texture;
    }

    // جهت‌گیری افقی (Flip) بدون برعکس شدن متن یا بافت
    const dirScale = state.facing === 1 ? 1 : -1;
    fighterObj.plane.scale.x = dirScale;
    fighterObj.plane.rotation.z = 0;
    fighterObj.plane.position.x = 0;
    fighterObj.mat.color.setHex(0xffffff);
    fighterObj.hitFlash.material.opacity = 0;

    // کوچک شدن سایه هنگام پرش
    const shadowScale = Math.max(0.4, 1 - (state.y || 0) * 0.25);
    fighterObj.shadow.scale.set(shadowScale, shadowScale, 1);
    fighterObj.shadow.position.y = -(state.y || 0) + 0.02;

    // واکنش‌های بصری دقیق هنگام ضربه زدن و ضربه خوردن
    if (state.action === 'hurt') {
        // واکنش شدید به ضربه: قرمز شدن لحظه‌ای، خم شدن به عقب و جرقه برخورد
        fighterObj.mat.color.setHex(0xff5555);
        fighterObj.plane.rotation.z = dirScale * 0.35; // خم شدن به عقب
        fighterObj.plane.position.x = -dirScale * 0.15;
        fighterObj.hitFlash.material.opacity = 0.85;
    } else if (state.action === 'punch' || state.action === 'kick') {
        // جهش رو به جلو هنگام حمله
        fighterObj.plane.position.x = dirScale * 0.35;
        fighterObj.plane.rotation.z = -dirScale * 0.15;
    } else if (state.action === 'special') {
        // درخشش طلایی-صورتی در ضربه ویژه
        fighterObj.mat.color.setHex(0xffe066);
        fighterObj.plane.position.x = dirScale * 0.45;
        fighterObj.hitFlash.material.opacity = 0.6;
    } else if (state.block) {
        // حالت دفاع (کمی عقب‌نشینی و سایه آبی دفاعی)
        fighterObj.mat.color.setHex(0x88ccff);
        fighterObj.plane.rotation.z = dirScale * 0.12;
    } else if (isMoving) {
        // تکان طبیعی گام برداشتن
        fighterObj.plane.position.y = 1.18 + Math.abs(Math.sin(performance.now() * 0.015)) * 0.08;
    } else {
        // تنفس آرام در حالت آماده
        fighterObj.plane.position.y = 1.18 + Math.sin(performance.now() * 0.005) * 0.02;
    }
}

function onResize() {
    const wrapper = document.getElementById('game-wrapper');
    renderer.setSize(wrapper.clientWidth, wrapper.clientHeight);
    camera.aspect = 16 / 9;
    camera.updateProjectionMatrix();
}
window.addEventListener('resize', onResize);
onResize();
requestAnimationFrame(gameLoop);
</script>
</body>
</html>
